[project]
name = "langraph-react-agent"
version = "0.1.0"
description = "First Langraph Agent"
authors = [
    {name = "Carlos Alvarez",email = "caralva527@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.2.10,<2.0.0)",
    "langchain-openai (>=1.1.10,<2.0.0)",
    "langchain-tavily (>=0.2.17,<0.3.0)",
    "langgraph (>=1.0.9,<2.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
